<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Token</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>

            Hospital OP System

        </div>

        <a href="index.html">

            <button class="home-btn">

                Home

            </button>

        </a>

    </div>

    <!-- MAIN CONTAINER -->

    <div class="container">

        <h2>

            <i class="fa-solid fa-user-doctor"></i>

            Book OP Token

        </h2>

        <!-- PATIENT NAME -->

        <input type="text"
               id="pname"
               placeholder="Enter Patient Name">

        <!-- AGE -->

        <input type="number"
               id="age"
               placeholder="Enter Age">

        <!-- HOSPITAL -->

        <select id="hospital">

            <option value="">
                Select Hospital
            </option>

            <option>
                City Hospital
            </option>

            <option>
                General Hospital
            </option>

            <option>
                Medical College
            </option>

        </select>

        <!-- DEPARTMENT -->

        <select id="department">

            <option value="">
                Select Department
            </option>

            <option>
                General Medicine
            </option>

            <option>
                ENT
            </option>

            <option>
                Cardiology
            </option>

            <option>
                Orthopedics
            </option>

        </select>

        <!-- DOCTOR -->

        <select id="doctor">

            <option value="">
                Select Doctor
            </option>

        </select>

        <!-- BOOK BUTTON -->

        <button class="btn-blue"
                onclick="bookToken()">

            <i class="fa-solid fa-ticket"></i>

            Generate Token

        </button>

        <!-- RESULT -->

        <div id="result"
             class="result-box"
             style="display:none;">

        </div>

    </div>

    <script src="script.js"></script>

</body>

  </html>
