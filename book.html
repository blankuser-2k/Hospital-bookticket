<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Token</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>
            Hospital OP System

        </div>

        <a href="index.html">

            <button class="home-btn">Home</button>

        </a>

    </div>

    <!-- CONTAINER -->
    <div class="container">

        <h2>
            <i class="fa-solid fa-ticket"></i>
            Book OP Token
        </h2>

        <!-- PATIENT NAME -->
        <input type="text" id="pname" placeholder="Enter Patient Name">

        <!-- AGE -->
        <input type="number" id="age" placeholder="Enter Age">

        <!-- HOSPITAL -->
        <select id="hospital" onchange="loadDoctorDropdown()">

            <option value="">Select Hospital</option>

            <option>City Hospital</option>
            <option>General Hospital</option>
            <option>Medical College</option>

        </select>

        <!-- DEPARTMENT -->
        <select id="department" onchange="loadDoctorDropdown()">

            <option value="">Select Department</option>

            <option>General Medicine</option>
            <option>ENT</option>
            <option>Cardiology</option>
            <option>Orthopedics</option>

        </select>

        <!-- DOCTOR -->
        <select id="doctor">

            <option value="">Select Doctor</option>

        </select>

        <!-- BOOK BUTTON -->
        <button class="btn-blue" onclick="bookToken()">

            <i class="fa-solid fa-ticket"></i>
            Generate Token

        </button>

        <!-- RESULT -->
        <div id="result" class="result-box" style="display:none;"></div>

        <!-- DASHBOARD BUTTON -->
        <div style="margin-top:20px; padding:12px; background:#f8f9fa; border-radius:10px;">

            <p style="margin-bottom:10px; color:#555;">
                Already booked token? Check live status here
            </p>

            <a href="dashboard.html">

                <button class="btn-blue">

                    <i class="fa-solid fa-chart-line"></i>
                    View Live Dashboard

                </button>

            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

                    </html>
