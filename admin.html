<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>

            Hospital Admin Panel

        </div>

        <a href="index.html">

            <button class="home-btn">

                Home

            </button>

        </a>

    </div>

    <!-- MAIN CONTAINER -->

    <div class="container">

        <h2>

            <i class="fa-solid fa-user-shield"></i>

            Admin Login

        </h2>

        <!-- PASSWORD -->

        <input type="password"
               id="pass"
               placeholder="Enter Admin Password">

        <!-- LOGIN BUTTON -->

        <button class="btn-blue"
                onclick="adminLogin()">

            Login

        </button>

        <!-- ADMIN PANEL -->

        <div id="adminPanel"
             style="display:none; margin-top:25px;">

            <!-- ADD DOCTOR -->

            <h3>

                <i class="fa-solid fa-user-doctor"></i>

                Add Doctor

            </h3>

            <input type="text"
                   id="hospital"
                   placeholder="Hospital Name">

            <input type="text"
                   id="department"
                   placeholder="Department">

            <input type="text"
                   id="doctorName"
                   placeholder="Doctor Name">

            <button class="btn-blue"
                    onclick="addDoctor()">

                Add Doctor

            </button>

            <!-- DOCTOR LIST -->

            <h3 style="margin-top:25px;">

                Doctor List

            </h3>

            <ul id="doctorList"></ul>

            <!-- TOKEN CONTROL -->

            <h3 style="margin-top:25px;">

                Queue Controls

            </h3>

            <input type="number"
                   id="currentTokenInput"
                   placeholder="Enter Current Token Number">

            <button class="btn-blue"
                    onclick="updateCurrentToken()">

                Update Current Token

            </button>

            <!-- NEXT TOKEN -->

            <button class="btn-blue"
                    onclick="nextToken()">

                Next Token

            </button>

            <!-- PATIENT LIST -->

            <h3 style="margin-top:25px;">

                Patient Queue

            </h3>

            <ul id="patientList"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>

          </html>
