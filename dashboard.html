<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>

            Hospital OP System

        </div>

        <a href="index.html">

            <button class="home-btn">

                Home

            </button>

        </a>

    </div>

    <!-- MAIN CONTAINER -->

    <div class="container">

        <h2>

            <i class="fa-solid fa-chart-line"></i>

            Patient Dashboard

        </h2>

        <!-- YOUR TOKEN -->

        <div class="card">

            <h3>

                <i class="fa-solid fa-ticket"></i>

                Your Token

            </h3>

            <div class="big-text"
                 id="myToken">

                OP101

            </div>

        </div>

        <!-- CURRENT TOKEN -->

        <div class="card">

            <h3>

                <i class="fa-solid fa-user-doctor"></i>

                Now Serving

            </h3>

            <div class="big-text"
                 id="currentToken">

                OP100

            </div>

        </div>

        <!-- WAITING -->

        <div class="card">

            <h3>

                <i class="fa-solid fa-users"></i>

                Waiting Patients

            </h3>

            <div class="big-text"
                 id="waitingCount">

                0

            </div>

        </div>

        <!-- TIME -->

        <div class="card">

            <h3>

                <i class="fa-solid fa-clock"></i>

                Estimated Waiting Time

            </h3>

            <div class="big-text"
                 id="waitingTime">

                0 mins

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

              </html>
